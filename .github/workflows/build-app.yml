name: Build Desktop EXE & Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. بناء تطبيق الويندوز (.exe) من الرابط المباشر
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Windows App from Live URL
        run: |
          npm install -g nativefier
          nativefier --name "Al-Dine" "https://aldinislam.github.io/AL-DIN-/" build-exe --single-instance

      - name: Zip Executable Folder
        run: |
          Compress-Archive -Path build-exe/* -DestinationPath Al-Dine-Windows.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Dine-Windows-Zip
          path: Al-Dine-Windows.zip

  # 2. بناء تطبيق الأندرويد (.apk)
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies Safely
        run: |
          npm install --legacy-peer-deps || true

      - name: Install Capacitor Dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps

      - name: Initialize and Add Android Platform
        run: |
          npx cap init "Al-Dine" "com.aldine.app" --web-dir "." || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Package-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
