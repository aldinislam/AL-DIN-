name: Build Desktop EXE & Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. بناء تطبيق الويندوز باستخدام Electron
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Build Electron EXE
        run: |
          npx electron-builder --win nsis unpacked || npx electron-forge make || npm run electron:build || npm run build:electron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable-App
          path: |
            dist/*.exe
            out/**/*.exe
            build/*.exe
            release/*.exe

  # 2. بناء تطبيق الأندرويد باستخدام Capacitor
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Package-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
