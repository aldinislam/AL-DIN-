name: Build Desktop EXE & Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. بناء تطبيق الويندوز (.exe) باستخدام PWABuilder / Nativefier
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps || true

      - name: Build Web App
        run: npm run build || true

      - name: Package Web App as Windows EXE
        run: |
          npx nativefier --name "Al-Dine App" "." --out dist-exe/ || mkdir dist-exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable-App
          path: dist-exe/

  # 2. بناء تطبيق الأندرويد (.apk)
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps || true

      - name: Build Project
        run: npm run build || true

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Build-Files
          path: |
            .
            !node_modules
            !.git
