name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || true

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          rsync -av --exclude='www' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' ./ www/

      - name: Initialize & Sync Capacitor
        run: |
          npx cap init "Al-Dine" "com.aldine.app" --web-dir "www" || true
          npx cap add android || true
          npx cap sync android

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Package-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
