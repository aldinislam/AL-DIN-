name: Build Android APK Only

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps || true

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev --legacy-peer-deps

      - name: Prepare Web Assets (Create www folder)
        run: |
          mkdir -p www
          rsync -av --exclude='www' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' ./ www/

      - name: Initialize and Sync Android
        run: |
          npx cap init "Al-Dine" "com.aldine.app" --web-dir "www" --force
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Package-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
